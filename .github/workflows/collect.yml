name: 매일 실거래 데이터 수집

on:
  schedule:
    - cron: '13 21 * * *'   # 매일 한국시간 오전 6:13 (UTC 21:13)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # data/ 변경사항 커밋
  pages: write               # Pages 재배포 요청

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 서울 최근 3개월 수집
        run: npm run collect-seoul
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: 단지별 정리
        run: npm run build-data

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi

      - name: Pages 재배포
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
